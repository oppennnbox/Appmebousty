name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find project and Build APK
        run: |
          # Автоматически находим папку с файлом settings.gradle
          TARGET_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
          if [ -z "$TARGET_DIR" ]; then
            echo "ОШИБКА: Файл settings.gradle.kts не найден! Проверьте имя файла."
            exit 1
          fi
          echo "Проект найден в: $TARGET_DIR"
          cd "$TARGET_DIR"
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentSchedule-Beta-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
